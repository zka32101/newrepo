name: Build Release APK

on:
  push:
    branches:
      - main
    paths:
      - '.build-apk'
      - '.release-trigger'
  push:
    tags:
      - 'v*'
  release:
    types:
      - published
      - created
  workflow_dispatch:
    inputs:
      app_version:
        description: 'App version (e.g., 1.0.0)'
        required: true
        type: string

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'

      - name: Get Flutter dependencies
        run: |
          flutter pub get
          flutter pub global activate intl_utils

      - name: Setup Android build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk

      - name: Build Release APK
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_FILE: ${{ secrets.KEYSTORE_FILE }}
        run: |
          flutter build apk \
            --split-per-abi \
            --release \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols

      - name: Build App Bundle (for Google Play)
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_FILE: ${{ secrets.KEYSTORE_FILE }}
        run: |
          flutter build appbundle \
            --release \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload App Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Create Release Notes
        id: release_notes
        run: |
          VERSION=${{ github.ref_name || github.event.inputs.app_version }}
          echo "version=${VERSION#v}" >> $GITHUB_OUTPUT
          echo "Created APK and App Bundle for version ${VERSION#v}"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ steps.release_notes.outputs.version }}
          draft: true
          prerelease: false
          files: |
            build/app/outputs/apk/release/*.apk
            build/app/outputs/bundle/release/app-release.aab
          body: |
            # Release ${{ steps.release_notes.outputs.version }}

            ## Build Information
            - **Build Date**: ${{ github.event.head_commit.timestamp }}
            - **Flutter Version**: 3.16.0
            - **Build Type**: Release (Optimized)

            ## APK Files
            - `app-arm64-v8a-release.apk` - For modern devices (64-bit)
            - `app-armeabi-v7a-release.apk` - For older devices (32-bit)
            - `app-x86-release.apk` - For x86 devices
            - `app-x86_64-release.apk` - For x86_64 devices
            - `app-release.aab` - App Bundle (Google Play)

            ## Next Steps
            1. Review the APK files
            2. Test on target devices
            3. Upload to Google Play Console
            4. Publish to production

            For detailed build information, see [BUILD_RELEASE_APK.md](BUILD_RELEASE_APK.md)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Google Play (optional)
        if: contains(github.event.head_commit.message, '[deploy]')
        run: |
          echo "📱 App Bundle is ready for Google Play upload"
          echo "📍 File: build/app/outputs/bundle/release/app-release.aab"
          echo "ℹ️ Manual upload via Google Play Console required"
          echo "ℹ️ Or use fastlane for automated deployment"

      - name: Build Summary
        run: |
          echo "✅ Build Completed Successfully"
          echo ""
          echo "📊 Build Artifacts:"
          ls -lh build/app/outputs/apk/release/
          ls -lh build/app/outputs/bundle/release/
          echo ""
          echo "📦 Total Size:"
          du -sh build/app/outputs/
