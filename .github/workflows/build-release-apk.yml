name: Build Release APK

on:
  push:
    tags:
      - 'v*'
  release:
    types:
      - published
      - created
  workflow_dispatch:
    inputs:
      app_version:
        description: 'App version (e.g., 1.0.0)'
        required: true
        type: string

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Get Flutter dependencies
        run: |
          flutter pub get
          flutter pub global activate intl_utils

      - name: Setup Android build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk

      - name: Build Release APK
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_FILE: ${{ secrets.KEYSTORE_FILE }}
        run: |
          flutter build apk \
            --split-per-abi \
            --release \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create Release Notes
        id: release_notes
        run: |
          VERSION=${{ github.ref_name || github.event.inputs.app_version }}
          echo "version=${VERSION#v}" >> $GITHUB_OUTPUT
          echo "Created APK for version ${VERSION#v}"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ steps.release_notes.outputs.version }}
          draft: true
          prerelease: false
          files: |
            build/app/outputs/apk/release/*.apk
          body: |
            # Release ${{ steps.release_notes.outputs.version }}

            ## Build Information
            - **Build Date**: ${{ github.event.head_commit.timestamp }}
            - **Flutter Version**: 3.24.0
            - **Build Type**: Release (Optimized & Obfuscated)
            - **APK Format**: Split-per-ABI

            ## APK Files
            - `app-arm64-v8a-release.apk` - For modern devices (64-bit ARM)
            - `app-armeabi-v7a-release.apk` - For older devices (32-bit ARM)
            - `app-x86-release.apk` - For x86 devices
            - `app-x86_64-release.apk` - For x86-64 devices

            ## Installation
            1. Download the APK file matching your device architecture
            2. Enable "Unknown Sources" in your device settings
            3. Run the APK file to install

            For detailed build information, see [BUILD_RELEASE_APK.md](BUILD_RELEASE_APK.md)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Info
        run: |
          echo "ℹ️ APK Build Completed"
          echo "📱 Direct distribution ready"
          echo "📍 Files available in GitHub Release"
          echo "ℹ️ For Google Play Store, consider using App Bundle""

      - name: Build Summary
        run: |
          echo "✅ Build Completed Successfully"
          echo ""
          echo "📊 APK Artifacts:"
          ls -lh build/app/outputs/apk/release/
          echo ""
          echo "📦 Total Size:"
          du -sh build/app/outputs/apk/release/
