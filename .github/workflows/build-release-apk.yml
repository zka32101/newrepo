name: Build Release APK

on:
  push:
    tags:
      - 'v*'
  release:
    types:
      - published
      - created
  workflow_dispatch:
    inputs:
      app_version:
        description: 'App version (e.g., 1.0.0)'
        required: true
        type: string

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.34.0'
          channel: 'stable'

      - name: Get Flutter dependencies
        run: |
          flutter pub get
          flutter pub global activate intl_utils

      - name: Setup Android build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_FILE }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::secrets.KEYSTORE_FILE (base64-encoded .jks) is not set. Add it in repo Settings > Secrets before running a release build."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release-keystore.jks"
          echo "STORE_FILE=$RUNNER_TEMP/release-keystore.jks" >> "$GITHUB_ENV"

      - name: Build Release APK
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          flutter build apk \
            --split-per-abi \
            --release \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols

      - name: Build App Bundle (for Google Play)
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          flutter build appbundle \
            --release \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload App Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Create Release Notes
        id: release_notes
        run: |
          VERSION=${{ github.ref_name || github.event.inputs.app_version }}
          echo "version=${VERSION#v}" >> $GITHUB_OUTPUT
          echo "Created APK for version ${VERSION#v}"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ steps.release_notes.outputs.version }}
          draft: true
          prerelease: false
          files: |
            build/app/outputs/apk/release/*.apk
            build/app/outputs/bundle/release/app-release.aab
          body: |
            # Release ${{ steps.release_notes.outputs.version }}

            ## Build Information
            - **Build Date**: ${{ github.event.head_commit.timestamp }}
            - **Flutter Version**: 3.34.0
            - **Build Type**: Release (Optimized & Obfuscated)
            - **APK Format**: Split-per-ABI

            ## APK Files (Direct Distribution)
            - `app-arm64-v8a-release.apk` - For modern devices (64-bit ARM)
            - `app-armeabi-v7a-release.apk` - For older devices (32-bit ARM)
            - `app-x86-release.apk` - For x86 devices
            - `app-x86_64-release.apk` - For x86-64 devices

            ## App Bundle (Google Play Store)
            - `app-release.aab` - For Google Play Store submission

            ## Installation
            **APK**: Download the APK file matching your device, enable "Unknown Sources", and install directly
            **AAB**: Upload to Google Play Console for automated device-specific APK delivery

            For detailed build information, see [BUILD_RELEASE_APK.md](BUILD_RELEASE_APK.md)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Summary
        run: |
          echo "✅ Build Completed Successfully"
          echo ""
          echo "📊 APK Artifacts:"
          ls -lh build/app/outputs/apk/release/
          echo ""
          echo "📱 App Bundle:"
          ls -lh build/app/outputs/bundle/release/
          echo ""
          echo "📦 Total Build Size:"
          du -sh build/app/outputs/
          echo ""
          echo "🎉 Release ready for:"
          echo "   - Direct APK distribution"
          echo "   - Google Play Store (via App Bundle)"
          echo "   - GitHub Release (auto-created)"

